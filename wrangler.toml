name = "contact-collector"
main = "src/index.js"
compatibility_date = "2026-11-01"

# D1 数据库：contact-collector-db
# 创建：wrangler d1 create contact-collector-db
# 用下面的 database_id 替换占位符
[[d1_databases]]
binding = "DB"
database_name = "contact-collector-db"
database_id = "74cd14ea-4336-401c-9ca2-3841576ec9ea"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[vars]
# 公开的站点标识，用于日志与统计；不含敏感信息
SITE_NAME = "contact-collector"

# ADMIN_TOKEN 请通过 secret 设置，不要写进本文件：
#   wrangler secret put ADMIN_TOKEN
